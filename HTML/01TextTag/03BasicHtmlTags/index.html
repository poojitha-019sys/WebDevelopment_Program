<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <select name="Juices">
        <option>Milk shake</option>
        <option>Mango juice</option>
        <option>Orange juice</option>
        <option disabled>Water melon juice</option>
        <option selected disabled>Oreo shake</option>
        <option label="Badam Milk">Badam Milk with Ice cream</option>


    </select>


    <select name="menu">
        <option>Veg</option>
        <option>Non veg</option>
        <option>Cool drinks</option>
    </select>

    <select name="dessert" required>
        <option>Donuts</option>
        <option>Falooda</option>
        <option>Brownie</option>
    </select>

     <select name="desserts" disabled>
        <option>Donuts</option>
        <option>Falooda</option>
    </select>

     <select name="Fast Food" multiple>
        <option>Burger</option>
        <option>Pizza</option>
        <option>Noodles</option>
        <option>French fries</option>
        <option>Sandwich</option>
    </select>

    
</body>
</html>
